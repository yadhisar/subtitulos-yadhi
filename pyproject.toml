[project]
name = "subtitulos-yadhi"
version = "0.1.0"
description = "Subtítulos animados estilo TikTok/Reels para videos de una persona hablando a cámara. 100% local, Windows."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper>=1.2.1",
    # mediapipe ya trae opencv-contrib-python (cv2); no se añade opencv-python para no tener dos cv2 peleándose.
    "mediapipe>=0.10.14",
    "opencv-contrib-python>=4.10",
    "numpy>=1.26",
    "pillow>=10.4",
]

[project.scripts]
subtitulos = "scripts.subtitulos:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
